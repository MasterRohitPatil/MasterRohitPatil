<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Rohit Patil — Technical Arsenal &amp; Core Capabilities">
  <defs>
    <!-- Brushed Titanium & Red Border -->
    <linearGradient id="stack-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#334155" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ED0C1F" stop-opacity="0.6"/>
    </linearGradient>

    <filter id="chip-glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
