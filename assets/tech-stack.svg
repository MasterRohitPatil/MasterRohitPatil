    .cat-track { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; font-weight: 800; fill: #ED0C1F; letter-spacing: 1.5px; }
    .chip-text { font-family: "SFMono-Regular", Consolas, monospace; font-size: 12.5px; font-weight: 600; fill: #CBD5E1; }
    .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 19px; font-weight: 900; fill: #FFFFFF; letter-spacing: 1px; }
    .header-sub { font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; font-weight: 700; fill: #ED0C1F; letter-spacing: 2px; }
