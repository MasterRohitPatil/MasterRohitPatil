<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Rohit Patil — Applied AI, Systems &amp; Data Engineering | Quantum Arc Reactor">
  <defs>
    <!-- Background Dot Grid -->
    <pattern id="grid-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#94A3B8" opacity="0.07"/>
    </pattern>

    <!-- Outer Card Metallic Platinum & Red Border -->
    <linearGradient id="card-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#475569" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#1E293B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ED0C1F" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Brushed Platinum Metallic Name Gradient -->
    <linearGradient id="silver-name-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F1F5F9"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- ================= 3D DEPTH PERCEPTION GRADIENTS ================= -->

    <!-- Level 1: Surface Chrome Bezel (Highest Plane) -->
    <linearGradient id="bevel-tier-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="75%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Level 2: Inward Sloping Bevel (Funnel Step 1) -->
    <linearGradient id="bevel-tier-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="40%" stop-color="#1E293B"/>
      <stop offset="80%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Level 3: Deep Sunken Wall (Funnel Step 2) -->
    <radialGradient id="deep-well-wall" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#020306"/>
      <stop offset="60%" stop-color="#070A12"/>
      <stop offset="85%" stop-color="#141B2D"/>
      <stop offset="100%" stop-color="#283548"/>
    </radialGradient>

    <!-- Inward Angled Vane Shading (Perspective Shading) -->
    <linearGradient id="vane-shading" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Core Sunken Plasma Bottom (Deepest Point) -->
    <radialGradient id="deep-plasma-bottom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#FFF1F2"/>
      <stop offset="45%" stop-color="#FF384C"/>
      <stop offset="75%" stop-color="#ED0C1F"/>
      <stop offset="92%" stop-color="#6B050D"/>
      <stop offset="100%" stop-color="#060709"/>
    </radialGradient>

    <!-- Glass Convex Lens Specular Highlight -->
    <linearGradient id="lens-reflection" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Ambient Red Core Glow -->
    <radialGradient id="deep-ambient-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ED0C1F" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#ED0C1F" stop-opacity="0.15"/>
      <stop offset="80%" stop-color="#ED0C1F" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for Stepped Tiers (Simulating Physical Depth) -->
    <filter id="tier-shadow-deep" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.95"/>
    </filter>

    <filter id="tier-shadow-mid" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <filter id="crimson-core-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur1"/>
      <feGaussianBlur stdDeviation="3" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtle-neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Kinetic Rotations for Concentric Depth Rings */
    @keyframes rotateClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes rotateCounterClockwise {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    /* Authentic Cardiac Heartbeat Rhythm Pulse (Lub-Dub) */
    @keyframes cardiacPulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(237,12,31,0.6)); }
      12% { transform: scale(1.18); filter: drop-shadow(0 0 32px rgba(237,12,31,0.95)); }
      22% { transform: scale(1.05); filter: drop-shadow(0 0 16px rgba(237,12,31,0.7)); }
      34% { transform: scale(1.24); filter: drop-shadow(0 0 45px rgba(237,12,31,1)); }
      55% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(237,12,31,0.6)); }
      100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(237,12,31,0.6)); }
    }

    /* Tunnel Depth Resonance Ring */
    @keyframes depthShockwave {
      0% { r: 24px; opacity: 0.9; }
      34% { r: 36px; opacity: 1; }
      75% { r: 76px; opacity: 0; }
      100% { r: 24px; opacity: 0; }
    }

    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .cursor { animation: blinkCursor 0.9s infinite; }
    .rot-cw-bezel { animation: rotateClockwise 30s linear infinite; transform-origin: 980px 220px; }
    .rot-ccw-bezel { animation: rotateCounterClockwise 18s linear infinite; transform-origin: 980px 220px; }
    .heart-beat-core { animation: cardiacPulse 1.9s ease-in-out infinite; transform-origin: 980px 220px; }
    .shockwave-anim { animation: depthShockwave 1.9s ease-out infinite; }

    .tech-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono-font { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; }
  </style>

  <!-- Container Box in Obsidian Black -->
  <rect x="1" y="1" width="1198" height="438" rx="24" fill="#060709" stroke="url(#card-border)" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="436" rx="23" fill="url(#grid-dots)"/>

  <!-- Top Machined Platinum Bevel Line -->
  <rect x="60" y="1" width="400" height="2.5" fill="#E2E8F0" opacity="0.6"/>
  <rect x="460" y="1" width="220" height="2.5" fill="#ED0C1F"/>

  <!-- ================= LEFT CONTENT AREA ================= -->
  
  <!-- Terminal Prompt -->
  <g transform="translate(60, 56)">
    <text class="mono-font" x="0" y="0" font-size="14.5" fill="#94A3B8" letter-spacing="1.5">&gt; system.init // </text>
    <text class="mono-font" x="156" y="0" font-size="14.5" fill="#ED0C1F" font-weight="700" letter-spacing="1.5">rohit_patil.sh</text>
    <rect class="cursor" x="290" y="-12" width="8" height="16" fill="#ED0C1F"/>
  </g>

  <!-- Grand Royal Name in Brushed Platinum Gradient -->
  <text class="tech-font" x="56" y="150" font-size="74" font-weight="900" fill="url(#silver-name-grad)" letter-spacing="2" style="text-rendering: optimizeLegibility;">
    ROHIT PATIL
  </text>

  <!-- Subtitle: Electric Red Accent with Silver Pipeline Divider -->
  <g transform="translate(60, 186)">
    <text class="mono-font" x="0" y="0" font-size="15" font-weight="800" fill="#ED0C1F" letter-spacing="3.5">
      APPLIED AI · SYSTEMS &amp; DATA ENGINEERING
    </text>
  </g>

  <!-- Core Thesis / Tagline in Frosted Silver -->
  <text class="tech-font" x="60" y="238" font-size="20" font-weight="600" fill="#E2E8F0" letter-spacing="0.3">
    Deterministic execution in production; unyielding endurance under pressure.
  </text>

  <!-- Sub-Focus Specialties in Muted Titanium Silver -->
  <text class="mono-font" x="60" y="278" font-size="14" font-weight="500" fill="#94A3B8" letter-spacing="0.4">
    Threat Early Warning &amp; Response · Clinical Explainable AI · Hybrid RAG · Star-Schema BI
  </text>

  <!-- Divider Line: Silver to Red transition -->
  <line x1="60" y1="322" x2="680" y2="322" stroke="#334155" stroke-width="1.2"/>

  <!-- Bottom Telemetry Status Strip -->
  <g transform="translate(60, 368)">
    <circle cx="6" cy="-4" r="5" fill="#ED0C1F"/>
    <circle cx="6" cy="-4" r="11" fill="none" stroke="#ED0C1F" stroke-width="1.2" opacity="0.4">
      <animate attributeName="r" values="6;18;6" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    
    <text class="mono-font" x="32" y="0" font-size="13" font-weight="800" fill="#ED0C1F" letter-spacing="1.5">OPEN TO ROLES 2027</text>
    <text class="mono-font" x="228" y="0" font-size="13" fill="#475569">|</text>
    <text class="mono-font" x="248" y="0" font-size="13" font-weight="600" fill="#E2E8F0" letter-spacing="0.5">TNP AIML Stream Head</text>
    <text class="mono-font" x="450" y="0" font-size="13" fill="#475569">|</text>
    <text class="mono-font" x="470" y="0" font-size="13" font-weight="600" fill="#CBD5E1" letter-spacing="0.5">10M Cumulative Industry Experience</text>
  </g>

  <!-- ================= RIGHT: 3D DEEP-WELL QUANTUM ARC REACTOR ================= -->
  <!-- Centered at cx=980, cy=220 | Multi-tier conical step-down with true depth perception -->
  <g id="deep-well-arc-reactor">

    <!-- Ambient Volumetric Core Halo -->
    <circle cx="980" cy="220" r="185" fill="url(#deep-ambient-glow)"/>

    <!-- ================= TIER 1: SURFACE CHROME BEZEL (HEIGHT: 0mm - TOP SURFACE) ================= -->
    <circle cx="980" cy="220" r="150" fill="url(#bevel-tier-1)" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Outer Bezel Precision Notches -->
    <circle cx="980" cy="220" r="142" fill="#04060A" stroke="#1E293B" stroke-width="2"/>
    <!-- Recessed Trench with Deep Ambient Drop Shadow -->
    <circle cx="980" cy="220" r="134" fill="#080C14" filter="url(#tier-shadow-deep)"/>

    <!-- Perimeter Flush Mechanical Rivets (Surface Level) -->
    <g>
      <circle cx="1122" cy="220" r="3.5" fill="#E2E8F0" stroke="#000000" stroke-width="1"/>
      <circle cx="838" cy="220" r="3.5" fill="#E2E8F0" stroke="#000000" stroke-width="1"/>
      <circle cx="980" cy="78" r="3.5" fill="#E2E8F0" stroke="#000000" stroke-width="1"/>
      <circle cx="980" cy="362" r="3.5" fill="#E2E8F0" stroke="#000000" stroke-width="1"/>
      <circle cx="1080" cy="120" r="3.5" fill="#E2E8F0" stroke="#000000" stroke-width="1"/>
      <circle cx="880" cy="320" r="3.5" fill="#E2E8F0" stroke="#000000" stroke-width="1"/>
      <circle cx="1080" cy="320" r="3.5" fill="#E2E8F0" stroke="#000000" stroke-width="1"/>
      <circle cx="880" cy="120" r="3.5" fill="#E2E8F0" stroke="#000000" stroke-width="1"/>
    </g>

    <!-- ================= TIER 2: INWARD SLOPING BEVEL WALL (DEPTH: -15mm) ================= -->
    <!-- Drop shadow cast by Tier 1 onto Tier 2 -->
    <circle cx="980" cy="220" r="126" fill="url(#bevel-tier-2)" stroke="#334155" stroke-width="2" filter="url(#tier-shadow-deep)"/>

    <!-- 12 INWARD-CONVERGING PERSPECTIVE VANES (Creates instant 3D Tunnel Depth!) -->
    <!-- Angled stator blades leading the eye down into the chamber -->
    <g stroke="#1E293B" stroke-width="1">
      <!-- 0 deg -->
      <polygon points="1106,216 1106,224 1056,222 1056,218" fill="url(#vane-shading)"/>
      <!-- 180 deg -->
      <polygon points="854,216 854,224 904,222 904,218" fill="url(#vane-shading)"/>
      <!-- 90 deg -->
      <polygon points="976,346 984,346 982,296 978,296" fill="url(#vane-shading)"/>
      <!-- 270 deg -->
      <polygon points="976,94 984,94 982,144 978,144" fill="url(#vane-shading)"/>
      <!-- 30 deg -->
      <polygon points="1089,283 1083,289 1042,260 1046,256" fill="url(#vane-shading)"/>
      <!-- 210 deg -->
      <polygon points="871,157 877,151 918,180 914,184" fill="url(#vane-shading)"/>
      <!-- 60 deg -->
      <polygon points="1043,329 1037,335 1012,286 1016,282" fill="url(#vane-shading)"/>
      <!-- 240 deg -->
      <polygon points="917,111 923,105 948,154 944,158" fill="url(#vane-shading)"/>
      <!-- 120 deg -->
      <polygon points="917,329 923,335 948,286 944,282" fill="url(#vane-shading)"/>
      <!-- 300 deg -->
      <polygon points="1043,111 1037,105 1012,154 1016,158" fill="url(#vane-shading)"/>
      <!-- 150 deg -->
      <polygon points="871,283 877,289 918,260 914,256" fill="url(#vane-shading)"/>
      <!-- 330 deg -->
      <polygon points="1089,157 1083,151 1042,180 1046,184" fill="url(#vane-shading)"/>
    </g>

    <!-- ================= TIER 3: SUNKEN KINETIC APERTURE RING (DEPTH: -35mm) ================= -->
    <!-- Sits inside the well, casting shadow onto the next tier -->
    <circle cx="980" cy="220" r="106" fill="url(#deep-well-wall)" stroke="#475569" stroke-width="1.8" filter="url(#tier-shadow-mid)"/>

    <!-- OUTER KINETIC GEAR RING (Rotating Clockwise inside the depth well) -->
    <g class="rot-cw-bezel">
      <circle cx="980" cy="220" r="98" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="14 10 28 10"/>
      <circle cx="980" cy="220" r="98" fill="none" stroke="#ED0C1F" stroke-width="3" stroke-dasharray="40 160 30 130" filter="url(#subtle-neon)"/>
      
      <!-- Caliper Tracking Beads -->
      <circle cx="1078" cy="220" r="4.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
      <circle cx="882" cy="220" r="4.5" fill="#ED0C1F" filter="url(#subtle-neon)"/>
      <circle cx="980" cy="122" r="4" fill="#CBD5E1"/>
      <circle cx="980" cy="318" r="4" fill="#ED0C1F"/>
    </g>

    <!-- ================= TIER 4: DEEP INNER STATOR WELL (DEPTH: -60mm) ================= -->
    <!-- The dark inner abyss where the core sits -->
    <circle cx="980" cy="220" r="78" fill="#020306" stroke="#1E293B" stroke-width="2" filter="url(#tier-shadow-deep)"/>
    <circle cx="980" cy="220" r="78" fill="none" stroke="#ED0C1F" stroke-width="1.2" opacity="0.6"/>

    <!-- INNER HIGH-SPEED COUNTER-ROTATING GEAR RING (Rotating Counter-Clockwise at Depth) -->
    <g class="rot-ccw-bezel">
      <circle cx="980" cy="220" r="68" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6 16 6"/>
      <circle cx="980" cy="220" r="68" fill="none" stroke="#ED0C1F" stroke-width="2.5" stroke-dasharray="60 70 40 90" filter="url(#subtle-neon)"/>
      
      <!-- Reverse Interlocking Aperture Blades -->
      <line x1="946" y1="186" x2="934" y2="174" stroke="#E2E8F0" stroke-width="2"/>
      <line x1="1014" y1="254" x2="1026" y2="266" stroke="#E2E8F0" stroke-width="2"/>
      <line x1="1014" y1="186" x2="1026" y2="174" stroke="#ED0C1F" stroke-width="2"/>
      <line x1="946" y1="254" x2="934" y2="266" stroke="#ED0C1F" stroke-width="2"/>
    </g>

    <!-- Deep Stator Circuit Collar with Internal Diodes -->
    <g>
      <circle cx="980" cy="220" r="48" fill="#04060B" stroke="#334155" stroke-width="1.5"/>
      <circle cx="980" cy="220" r="48" fill="none" stroke="#ED0C1F" stroke-width="1.5" stroke-dasharray="4 8"/>
      
      <circle cx="936" cy="220" r="2.5" fill="#FFFFFF"/>
      <circle cx="1024" cy="220" r="2.5" fill="#FFFFFF"/>
      <circle cx="980" cy="176" r="2.5" fill="#FFFFFF"/>
      <circle cx="980" cy="264" r="2.5" fill="#FFFFFF"/>
    </g>

    <!-- ================= TIER 5: SUNKEN PLASMA CORE (DEPTH: -80mm - DEEPEST SHAFT FLOOR) ================= -->
    <!-- The glowing plasma singularity sitting far down in the bottom of the well -->
    <circle class="shockwave-anim" cx="980" cy="220" r="24" fill="none" stroke="#ED0C1F" stroke-width="2.5" filter="url(#subtle-neon)"/>

    <g class="heart-beat-core">
      <!-- Deep Well Shadow Base -->
      <circle cx="980" cy="220" r="30" fill="#140204" filter="url(#crimson-core-glow)"/>
      
      <!-- Multi-Layer High-Yield Core Singularity -->
      <circle cx="980" cy="220" r="22" fill="url(#deep-plasma-bottom)" filter="url(#subtle-neon)"/>
      <circle cx="980" cy="220" r="13" fill="#ED0C1F"/>
      
      <!-- Pure White-Hot Focal Eye -->
      <circle cx="980" cy="220" r="6" fill="#FFFFFF" filter="url(#subtle-neon)"/>
      <circle cx="980" cy="220" r="2.5" fill="#FFFFFF"/>
    </g>

    <!-- ================= TIER 6: CONVEX QUARTZ LENS REFLECTION (FRONT SURFACE OVERLAY) ================= -->
    <!-- Curved glass specular crescent across the top-left rim creating tactile glass enclosure depth -->
    <path d="M870,150 A140,140 0 0,1 1060,110 A126,126 0 0,0 870,150 Z" fill="url(#lens-reflection)"/>
    <ellipse cx="920" cy="140" rx="36" ry="12" transform="rotate(-35 920 140)" fill="#FFFFFF" opacity="0.12"/>

  </g>
</svg>