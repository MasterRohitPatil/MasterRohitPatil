<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Rohit Patil — Applied AI, Systems &amp; Data Engineering">
  <defs>
    <!-- Background Dot Grid in Subtle Platinum -->
    <pattern id="grid-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#94A3B8" opacity="0.07"/>
    </pattern>

    <!-- Metallic Platinum & Electric Red Border -->
    <linearGradient id="card-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.7"/>
      <stop offset="25%" stop-color="#64748B" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#1E293B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ED0C1F" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Brushed Platinum Metallic Name Gradient -->
    <linearGradient id="silver-name-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F1F5F9"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Machined Platinum Facet Gradients (3D Reactor) -->
    <linearGradient id="titanium-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="40%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <linearGradient id="titanium-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="titanium-right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>

    <linearGradient id="silver-bezel-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Deep Red Glowing Core -->
    <radialGradient id="plasma-core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FF4D5E"/>
      <stop offset="65%" stop-color="#ED0C1F"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </radialGradient>

    <radialGradient id="ambient-glow" cx="0.82" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#ED0C1F" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#ED0C1F" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Precision Laser Glow Filter -->
    <filter id="crimson-laser-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="silver-sheen">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulsePlasmaCore {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 16px rgba(237,12,31,0.75)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 36px rgba(237,12,31,1)); }
    }
    @keyframes rotateClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes rotateCounter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .cursor { animation: blinkCursor 0.9s infinite; }
    .rot-cw { transform-origin: 980px 220px; animation: rotateClockwise 36s linear infinite; }
    .rot-ccw { transform-origin: 980px 220px; animation: rotateCounter 22s linear infinite; }
    .plasma-core-anim { transform-origin: 980px 220px; animation: pulsePlasmaCore 3.2s ease-in-out infinite; }
    
    .tech-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono-font { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; }
  </style>

  <!-- Container Box in Obsidian Black -->
  <rect x="1" y="1" width="1198" height="438" rx="24" fill="#060709" stroke="url(#card-border)" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="436" rx="23" fill="url(#grid-dots)"/>
  <rect x="2" y="2" width="1196" height="436" rx="23" fill="url(#ambient-glow)"/>

  <!-- Top Machined Platinum Bevel Line -->
  <rect x="60" y="1" width="400" height="2.5" fill="#E2E8F0" opacity="0.6"/>
  <rect x="460" y="1" width="220" height="2.5" fill="#ED0C1F"/>

  <!-- ================= LEFT CONTENT AREA ================= -->
  
  <!-- Terminal Prompt -->
  <g transform="translate(60, 56)">
    <text class="mono-font" x="0" y="0" font-size="14.5" fill="#94A3B8" letter-spacing="1.5">&gt; system.init // </text>
    <text class="mono-font" x="156" y="0" font-size="14.5" fill="#ED0C1F" font-weight="700" letter-spacing="1.5">rohit_patil.sh</text>
    <rect class="cursor" x="290" y="-12" width="8" height="16" fill="#ED0C1F"/>
  </g>

  <!-- Grand Royal Name in Brushed Platinum Gradient -->
  <text class="tech-font" x="56" y="150" font-size="74" font-weight="900" fill="url(#silver-name-grad)" letter-spacing="2" style="text-rendering: optimizeLegibility;">
    ROHIT PATIL
  </text>

  <!-- Subtitle: Electric Red Accent with Silver Pipeline Divider -->
  <g transform="translate(60, 186)">
    <text class="mono-font" x="0" y="0" font-size="15" font-weight="800" fill="#ED0C1F" letter-spacing="3.5">
      APPLIED AI · SYSTEMS &amp; DATA ENGINEERING
    </text>
  </g>

  <!-- Core Thesis / Tagline in Frosted Silver -->
  <text class="tech-font" x="60" y="238" font-size="20" font-weight="600" fill="#E2E8F0" letter-spacing="0.3">
    Deterministic execution in production; unyielding endurance under pressure.
  </text>

  <!-- Sub-Focus Specialties in Muted Titanium Silver -->
  <text class="mono-font" x="60" y="278" font-size="14" font-weight="500" fill="#94A3B8" letter-spacing="0.4">
    Threat Early Warning &amp; Response · Clinical Explainable AI · Hybrid RAG · Star-Schema BI
  </text>

  <!-- Divider Line: Silver to Red transition -->
  <line x1="60" y1="322" x2="680" y2="322" stroke="#334155" stroke-width="1.2"/>

  <!-- Bottom Telemetry Status Strip -->
  <g transform="translate(60, 368)">
    <!-- Pulsing Red Indicator -->
    <circle cx="6" cy="-4" r="5" fill="#ED0C1F"/>
    <circle cx="6" cy="-4" r="11" fill="none" stroke="#ED0C1F" stroke-width="1.2" opacity="0.4">
      <animate attributeName="r" values="6;18;6" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    
    <text class="mono-font" x="32" y="0" font-size="13" font-weight="800" fill="#ED0C1F" letter-spacing="1.5">OPEN TO ROLES 2027</text>
    <text class="mono-font" x="228" y="0" font-size="13" fill="#475569">|</text>
    <text class="mono-font" x="248" y="0" font-size="13" font-weight="600" fill="#E2E8F0" letter-spacing="0.5">TNP AIML Stream Head</text>
    <text class="mono-font" x="450" y="0" font-size="13" fill="#475569">|</text>
    <text class="mono-font" x="470" y="0" font-size="13" font-weight="600" fill="#CBD5E1" letter-spacing="0.5">10M Cumulative Industry Experience</text>
  </g>

  <!-- ================= RIGHT: PRECISION TITANIUM & CRIMSON KINETIC REACTOR ================= -->
  <!-- Centered at x=980, y=220 (leaving a massive 300px clear gap from left text) -->
  <g id="machined-titanium-reactor">
    <!-- Ambient Core Plasma Halo -->
    <circle cx="980" cy="220" r="175" fill="url(#ambient-glow)"/>

    <!-- Outer Gimbal Caliper Ring in Brushed Platinum (Rotating Clockwise) -->
    <g class="rot-cw">
      <!-- Silver Carrier Track -->
      <circle cx="980" cy="220" r="150" fill="none" stroke="#334155" stroke-width="2"/>
      <circle cx="980" cy="220" r="150" fill="none" stroke="url(#silver-bezel-ring)" stroke-width="3" stroke-dasharray="30 150 60 120" filter="url(#silver-sheen)"/>
      <circle cx="980" cy="220" r="150" fill="none" stroke="#ED0C1F" stroke-width="3.5" stroke-dasharray="0 240 45 75" filter="url(#crimson-laser-glow)"/>
      
      <!-- Caliper Nodes -->
      <circle cx="1130" cy="220" r="6" fill="#E2E8F0" stroke="#060709" stroke-width="1.5"/>
      <circle cx="830" cy="220" r="5" fill="#ED0C1F" filter="url(#crimson-laser-glow)"/>
      <circle cx="980" cy="70" r="4" fill="#CBD5E1"/>
      <circle cx="980" cy="370" r="4" fill="#ED0C1F"/>
    </g>

    <!-- Inner Counter-Rotating Gear Rotor (Rotating Counter-Clockwise) -->
    <g class="rot-ccw">
      <circle cx="980" cy="220" r="122" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="16 8 32 8"/>
      <!-- Precision Machined Teeth Marks -->
      <circle cx="1066" cy="134" r="5" fill="#E2E8F0"/>
      <circle cx="894" cy="306" r="5" fill="#ED0C1F"/>
    </g>

    <!-- SOLID 3D ISOMETRIC TITANIUM PRISM & APERTURE CORE -->
    <g class="plasma-core-anim">
      <!-- Base Chassis Drop Shadow -->
      <polygon points="980,136 1054,178 1054,262 980,304 906,262 906,178" fill="#090D16" stroke="#1E293B" stroke-width="2"/>

      <!-- Top Machined Platinum Facet (Reflective Sheen) -->
      <polygon points="980,136 1054,178 980,220 906,178" fill="url(#titanium-top)" stroke="#F8FAFC" stroke-width="1.2"/>
      
      <!-- Left Titanium Facet (Mid Shading) -->
      <polygon points="906,178 980,220 980,304 906,262" fill="url(#titanium-left)" stroke="#475569" stroke-width="1.2"/>
      
      <!-- Right Titanium Facet (Deep Shading) -->
      <polygon points="980,220 1054,178 1054,262 980,304" fill="url(#titanium-right)" stroke="#334155" stroke-width="1.2"/>

      <!-- Precision Milled Energy Conduits (Platinum Chamfers with Crimson Glow) -->
      <polygon points="980,158 1028,185 980,212 932,185" fill="#0A0F1D" stroke="#E2E8F0" stroke-width="1.5"/>
      <line x1="980" y1="220" x2="980" y2="294" stroke="#ED0C1F" stroke-width="3" filter="url(#crimson-laser-glow)"/>
      <line x1="906" y1="262" x2="980" y2="220" stroke="#E2E8F0" stroke-width="1" opacity="0.6"/>
      <line x1="1054" y1="262" x2="980" y2="220" stroke="#E2E8F0" stroke-width="1" opacity="0.6"/>

      <!-- Glowing High-Yield Nuclear Iris Core -->
      <circle cx="980" cy="220" r="36" fill="#060709" stroke="#E2E8F0" stroke-width="2"/>
      <circle cx="980" cy="220" r="28" fill="#1C0407" stroke="#ED0C1F" stroke-width="2.5" filter="url(#crimson-laser-glow)"/>
      <circle cx="980" cy="220" r="18" fill="url(#plasma-core)"/>
      <circle cx="980" cy="220" r="7" fill="#FFFFFF"/>
    </g>

    <!-- Calibrated Cardinal Degree Markings in Silver -->
    <line x1="980" y1="48" x2="980" y2="64" stroke="#E2E8F0" stroke-width="2"/>
    <line x1="980" y1="376" x2="980" y2="392" stroke="#ED0C1F" stroke-width="2"/>
    <line x1="808" y1="220" x2="824" y2="220" stroke="#E2E8F0" stroke-width="2"/>
    <line x1="1136" y1="220" x2="1152" y2="220" stroke="#ED0C1F" stroke-width="2"/>

    <text class="mono-font" x="980" y="40" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="1">000° [SYS.INIT]</text>
    <text class="mono-font" x="1166" y="224" font-size="10" font-weight="700" fill="#ED0C1F" letter-spacing="1">090°</text>
    <text class="mono-font" x="980" y="408" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="1">180° [TELEMETRY]</text>
    <text class="mono-font" x="780" y="224" font-size="10" font-weight="700" fill="#CBD5E1" text-anchor="end" letter-spacing="1">270°</text>
  </g>
</svg>