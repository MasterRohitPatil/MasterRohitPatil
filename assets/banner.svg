<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Rohit Patil — Applied AI, Systems &amp; Data Engineering | Red H.A.R.T. Core">
  <defs>
    <!-- Background Dot Grid -->
    <pattern id="grid-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#94A3B8" opacity="0.07"/>
    </pattern>

    <!-- Metallic Platinum & Electric Red Border -->
    <linearGradient id="card-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#475569" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#1E293B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ED0C1F" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Brushed Platinum Metallic Name Gradient -->
    <linearGradient id="silver-name-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F1F5F9"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Outer Chrome Bezel Rim Gradient -->
    <linearGradient id="chrome-bezel-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="18%" stop-color="#E2E8F0"/>
      <stop offset="45%" stop-color="#475569"/>
      <stop offset="75%" stop-color="#94A3B8"/>
      <stop offset="90%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Core Ambient Red Glow -->
    <radialGradient id="hart-ambient-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ED0C1F" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#ED0C1F" stop-opacity="0.12"/>
      <stop offset="75%" stop-color="#ED0C1F" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Plasma Heart Singularity Gradient -->
    <radialGradient id="heart-plasma-singularity" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FFF1F2"/>
      <stop offset="50%" stop-color="#FF384C"/>
      <stop offset="80%" stop-color="#ED0C1F"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </radialGradient>

    <!-- Neon Glow Filters -->
    <filter id="crimson-core-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="2.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtle-neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Kinetic Rotations for Concentric Rings */
    @keyframes rotateClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes rotateCounterClockwise {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    /* Authentic Cardiac Heartbeat Rhythm Pulse (Lub-Dub) */
    @keyframes cardiacPulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(237,12,31,0.6)); }
      12% { transform: scale(1.18); filter: drop-shadow(0 0 30px rgba(237,12,31,0.95)); }
      22% { transform: scale(1.05); filter: drop-shadow(0 0 16px rgba(237,12,31,0.7)); }
      34% { transform: scale(1.24); filter: drop-shadow(0 0 42px rgba(237,12,31,1)); }
      55% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(237,12,31,0.6)); }
      100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(237,12,31,0.6)); }
    }

    /* Shockwave Expanding Ring */
    @keyframes shockwavePulse {
      0% { r: 24px; opacity: 0.95; }
      34% { r: 32px; opacity: 1; }
      75% { r: 68px; opacity: 0; }
      100% { r: 24px; opacity: 0; }
    }

    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .cursor { animation: blinkCursor 0.9s infinite; }
    .rot-cw-bezel { animation: rotateClockwise 28s linear infinite; transform-origin: 980px 220px; }
    .rot-ccw-bezel { animation: rotateCounterClockwise 18s linear infinite; transform-origin: 980px 220px; }
    .heart-beat-core { animation: cardiacPulse 1.9s ease-in-out infinite; transform-origin: 980px 220px; }
    .shockwave-anim { animation: shockwavePulse 1.9s ease-out infinite; }

    .tech-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono-font { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; }
  </style>

  <!-- Container Box in Obsidian Black -->
  <rect x="1" y="1" width="1198" height="438" rx="24" fill="#060709" stroke="url(#card-border)" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="436" rx="23" fill="url(#grid-dots)"/>

  <!-- Top Machined Platinum Bevel Line -->
  <rect x="60" y="1" width="400" height="2.5" fill="#E2E8F0" opacity="0.6"/>
  <rect x="460" y="1" width="220" height="2.5" fill="#ED0C1F"/>

  <!-- ================= LEFT CONTENT AREA ================= -->
  
  <!-- Terminal Prompt -->
  <g transform="translate(60, 56)">
    <text class="mono-font" x="0" y="0" font-size="14.5" fill="#94A3B8" letter-spacing="1.5">&gt; system.init // </text>
    <text class="mono-font" x="156" y="0" font-size="14.5" fill="#ED0C1F" font-weight="700" letter-spacing="1.5">rohit_patil.sh</text>
    <rect class="cursor" x="290" y="-12" width="8" height="16" fill="#ED0C1F"/>
  </g>

  <!-- Grand Royal Name in Brushed Platinum Gradient -->
  <text class="tech-font" x="56" y="150" font-size="74" font-weight="900" fill="url(#silver-name-grad)" letter-spacing="2" style="text-rendering: optimizeLegibility;">
    ROHIT PATIL
  </text>

  <!-- Subtitle: Electric Red Accent with Silver Pipeline Divider -->
  <g transform="translate(60, 186)">
    <text class="mono-font" x="0" y="0" font-size="15" font-weight="800" fill="#ED0C1F" letter-spacing="3.5">
      APPLIED AI · SYSTEMS &amp; DATA ENGINEERING
    </text>
  </g>

  <!-- Core Thesis / Tagline in Frosted Silver -->
  <text class="tech-font" x="60" y="238" font-size="20" font-weight="600" fill="#E2E8F0" letter-spacing="0.3">
    Deterministic execution in production; unyielding endurance under pressure.
  </text>

  <!-- Sub-Focus Specialties in Muted Titanium Silver -->
  <text class="mono-font" x="60" y="278" font-size="14" font-weight="500" fill="#94A3B8" letter-spacing="0.4">
    Threat Early Warning &amp; Response · Clinical Explainable AI · Hybrid RAG · Star-Schema BI
  </text>

  <!-- Divider Line: Silver to Red transition -->
  <line x1="60" y1="322" x2="680" y2="322" stroke="#334155" stroke-width="1.2"/>

  <!-- Bottom Telemetry Status Strip -->
  <g transform="translate(60, 368)">
    <circle cx="6" cy="-4" r="5" fill="#ED0C1F"/>
    <circle cx="6" cy="-4" r="11" fill="none" stroke="#ED0C1F" stroke-width="1.2" opacity="0.4">
      <animate attributeName="r" values="6;18;6" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    
    <text class="mono-font" x="32" y="0" font-size="13" font-weight="800" fill="#ED0C1F" letter-spacing="1.5">OPEN TO ROLES 2027</text>
    <text class="mono-font" x="228" y="0" font-size="13" fill="#475569">|</text>
    <text class="mono-font" x="248" y="0" font-size="13" font-weight="600" fill="#E2E8F0" letter-spacing="0.5">TNP AIML Stream Head</text>
    <text class="mono-font" x="450" y="0" font-size="13" fill="#475569">|</text>
    <text class="mono-font" x="470" y="0" font-size="13" font-weight="600" fill="#CBD5E1" letter-spacing="0.5">10M Cumulative Industry Experience</text>
  </g>

  <!-- ================= RIGHT: THE RED H.A.R.T. CIRCULAR ARC-REACTOR ================= -->
  <!-- Centered cleanly at cx=980, cy=220 (zero cones, zero back cylinders, zero stands) -->
  <g id="hart-arc-reactor">

    <!-- Ambient Core Red Aura Halo -->
    <circle cx="980" cy="220" r="175" fill="url(#hart-ambient-glow)"/>

    <!-- ================= 1. MACHINED TITANIUM / CHROME OUTER CALIPER BEZEL ================= -->
    <circle cx="980" cy="220" r="148" fill="url(#chrome-bezel-grad)" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="980" cy="220" r="136" fill="#04060A" stroke="#1E293B" stroke-width="2"/>
    <circle cx="980" cy="220" r="130" fill="#080C14" stroke="#ED0C1F" stroke-width="1.5" opacity="0.8"/>
    <circle cx="980" cy="220" r="120" fill="#020306" stroke="#475569" stroke-width="1.8"/>

    <!-- Perimeter Bezel Rivets / Bolts at 45-degree intervals -->
    <g>
      <circle cx="1120" cy="220" r="3.5" fill="#CBD5E1" stroke="#060709" stroke-width="1"/>
      <circle cx="840" cy="220" r="3.5" fill="#CBD5E1" stroke="#060709" stroke-width="1"/>
      <circle cx="980" cy="80" r="3.5" fill="#CBD5E1" stroke="#060709" stroke-width="1"/>
      <circle cx="980" cy="360" r="3.5" fill="#CBD5E1" stroke="#060709" stroke-width="1"/>
      <circle cx="1079" cy="121" r="3.5" fill="#CBD5E1" stroke="#060709" stroke-width="1"/>
      <circle cx="881" cy="319" r="3.5" fill="#CBD5E1" stroke="#060709" stroke-width="1"/>
      <circle cx="1079" cy="319" r="3.5" fill="#CBD5E1" stroke="#060709" stroke-width="1"/>
      <circle cx="881" cy="121" r="3.5" fill="#CBD5E1" stroke="#060709" stroke-width="1"/>
    </g>

    <!-- ================= 2. KINETIC CONCENTRIC ROTATING RINGS ================= -->

    <!-- RING 1 (OUTER): Precision Segmented Caliper Ring — ROTATING CLOCKWISE (28s) -->
    <g class="rot-cw-bezel">
      <circle cx="980" cy="220" r="110" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="16 12 32 12"/>
      <circle cx="980" cy="220" r="110" fill="none" stroke="#ED0C1F" stroke-width="3" stroke-dasharray="45 180 35 140" filter="url(#subtle-neon)"/>
      
      <!-- Caliper Tracking Nodes -->
      <circle cx="1090" cy="220" r="5" fill="#FFFFFF" stroke="#060709" stroke-width="1.5"/>
      <circle cx="870" cy="220" r="5" fill="#ED0C1F" filter="url(#subtle-neon)"/>
      <circle cx="980" cy="110" r="4.5" fill="#CBD5E1"/>
      <circle cx="980" cy="330" r="4.5" fill="#ED0C1F"/>
      
      <!-- Corner Laser Pointers -->
      <circle cx="1058" cy="142" r="3.5" fill="#FFFFFF"/>
      <circle cx="902" cy="298" r="3.5" fill="#FFFFFF"/>
      <circle cx="1058" cy="298" r="3.5" fill="#ED0C1F"/>
      <circle cx="902" cy="142" r="3.5" fill="#ED0C1F"/>
    </g>

    <!-- RING 2 (MIDDLE): High-Speed Gear & Circuit Ring — ROTATING COUNTER-CLOCKWISE (18s) -->
    <g class="rot-ccw-bezel">
      <circle cx="980" cy="220" r="80" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="10 8 20 8"/>
      <circle cx="980" cy="220" r="80" fill="none" stroke="#ED0C1F" stroke-width="2.5" stroke-dasharray="70 90 50 110" filter="url(#subtle-neon)"/>
      
      <!-- Gear Teeth Studs -->
      <circle cx="1060" cy="220" r="4.5" fill="#ED0C1F"/>
      <circle cx="900" cy="220" r="4.5" fill="#ED0C1F"/>
      <circle cx="980" cy="140" r="4" fill="#FFFFFF"/>
      <circle cx="980" cy="300" r="4" fill="#FFFFFF"/>

      <!-- Reverse Interlocking Aperture Blades -->
      <line x1="940" y1="180" x2="925" y2="165" stroke="#E2E8F0" stroke-width="2"/>
      <line x1="1020" y1="260" x2="1035" y2="275" stroke="#E2E8F0" stroke-width="2"/>
      <line x1="1020" y1="180" x2="1035" y2="165" stroke="#ED0C1F" stroke-width="2"/>
      <line x1="940" y1="260" x2="925" y2="275" stroke="#ED0C1F" stroke-width="2"/>
    </g>

    <!-- ================= 3. STATIONARY STATOR RING: Micro-Circuit Etchings & Diodes ================= -->
    <g>
      <circle cx="980" cy="220" r="54" fill="#04060C" stroke="#334155" stroke-width="1.8"/>
      <circle cx="980" cy="220" r="54" fill="none" stroke="#ED0C1F" stroke-width="1.5" stroke-dasharray="5 10"/>
      
      <!-- Cardinal Alignment Ticks -->
      <line x1="926" y1="220" x2="938" y2="220" stroke="#ED0C1F" stroke-width="2"/>
      <line x1="1034" y1="220" x2="1022" y2="220" stroke="#ED0C1F" stroke-width="2"/>
      <line x1="980" y1="166" x2="980" y2="178" stroke="#ED0C1F" stroke-width="2"/>
      <line x1="980" y1="274" x2="980" y2="262" stroke="#ED0C1F" stroke-width="2"/>
      
      <!-- Micro Diode Studs -->
      <circle cx="932" cy="220" r="3" fill="#FFFFFF"/>
      <circle cx="1028" cy="220" r="3" fill="#FFFFFF"/>
      <circle cx="980" cy="172" r="3" fill="#FFFFFF"/>
      <circle cx="980" cy="268" r="3" fill="#FFFFFF"/>
    </g>

    <!-- ================= 4. DYNAMIC SHOCKWAVE EXPANSION RING ================= -->
    <circle class="shockwave-anim" cx="980" cy="220" r="24" fill="none" stroke="#ED0C1F" stroke-width="2.5" filter="url(#subtle-neon)"/>

    <!-- ================= 5. CARDIAC HEARTBEAT CORE (LUB-DUB RHYTHMIC PULSE) ================= -->
    <g class="heart-beat-core">
      <!-- Deep Plasma Well Shadow -->
      <circle cx="980" cy="220" r="32" fill="#140204" filter="url(#crimson-core-glow)"/>
      
      <!-- Layered Plasma Singularity -->
      <circle cx="980" cy="220" r="24" fill="url(#heart-plasma-singularity)" filter="url(#subtle-neon)"/>
      <circle cx="980" cy="220" r="14" fill="#ED0C1F"/>
      
      <!-- Intense White-Hot Singularity Eye -->
      <circle cx="980" cy="220" r="7" fill="#FFFFFF" filter="url(#subtle-neon)"/>
      <circle cx="980" cy="220" r="3" fill="#FFFFFF"/>
    </g>

    <!-- ================= 6. CARDINAL DEGREE TELEMETRY TICKS ================= -->
    <line x1="980" y1="48" x2="980" y2="64" stroke="#E2E8F0" stroke-width="2"/>
    <line x1="980" y1="376" x2="980" y2="392" stroke="#ED0C1F" stroke-width="2"/>
    <line x1="808" y1="220" x2="824" y2="220" stroke="#E2E8F0" stroke-width="2"/>
    <line x1="1136" y1="220" x2="1152" y2="220" stroke="#ED0C1F" stroke-width="2"/>

    <text class="mono-font" x="980" y="40" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="1">000° [H.A.R.T.]</text>
    <text class="mono-font" x="1166" y="224" font-size="10" font-weight="700" fill="#ED0C1F" letter-spacing="1">090°</text>
    <text class="mono-font" x="980" y="408" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="1">180° [RESONANCE]</text>
    <text class="mono-font" x="780" y="224" font-size="10" font-weight="700" fill="#CBD5E1" text-anchor="end" letter-spacing="1">270°</text>

  </g>
</svg>